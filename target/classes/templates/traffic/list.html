<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Traffic Records – ThreatSense5G</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div>
            <h1>Traffic Records</h1>
            <p class="text-muted mb-0">
                Records for source <span th:text="${source}">file.csv</span>
            </p>
        </div>
        <a th:href="@{/traffic/history}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back to history
        </a>
    </div>

    <div th:if="${#lists.isEmpty(records)}" class="alert alert-secondary">
        No records found for this source.
    </div>

    <div th:if="${!#lists.isEmpty(records)}" class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Source IP</th>
                        <th>Destination IP</th>
                        <th>Protocol</th>
                        <th>Packets</th>
                        <th>Duration (ms)</th>
                        <th class="text-end">Detail</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${records}">
                        <td th:text="${t.timestamp}">2024-01-01T00:00:00</td>
                        <td th:text="${t.srcIp}">10.0.0.1</td>
                        <td th:text="${t.dstIp}">10.0.0.2</td>
                        <td th:text="${t.protocol}">TCP</td>
                        <td th:text="${t.packetCount}">10</td>
                        <td th:text="${t.durationMs}">100</td>
                        <td class="text-end">
                            <a th:href="@{/traffic/{id}(id=${t.id})}" class="btn btn-primary btn-sm">View</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
