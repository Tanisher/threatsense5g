<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>ThreatSense5G - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
            color: #212529;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .login-card {
            background-color: #ffffff;
            color: #212529;
            border-radius: 0.75rem;
            border: 1px solid #dee2e6;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 100%;
            padding: 2rem 2.25rem;
        }

        .brand-title {
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-size: 0.9rem;
            color: #212529;
        }

        .brand-accent { color: #e94560; }

        .btn-accent {
            background-color: #e94560;
            border-color: #e94560;
            color: #ffffff;
        }
        .btn-accent:hover {
            background-color: #f0526d;
            border-color: #f0526d;
            color: #ffffff;
        }

        .login-card .form-label { color: #212529; }
        .login-card .form-control {
            background-color: #ffffff;
            color: #212529;
            border: 1px solid #ced4da;
        }
        .login-card .form-control:focus {
            background-color: #ffffff;
            color: #212529;
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .login-card .text-secondary { color: #6c757d !important; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="mb-4 text-center">
        <div class="brand-title">
            THREATSENSE<span class="brand-accent">5G</span>
        </div>
        <div class="mt-2 text-secondary" style="font-size: 0.9rem; color: #6c757d;">
            Analyst console sign‑in
        </div>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2 mb-3" role="alert">
        <span th:text="${param.error} ? 'Invalid credentials or access denied.'"></span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-accent">
                Sign in
            </button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
