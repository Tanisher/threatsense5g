<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>ThreatSense5G</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f8f9fa; color: #212529; display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { background: #1a1a2e !important; padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
        .navbar-brand { color: #e94560 !important; font-size: 1.4rem; font-weight: bold; text-decoration: none; }
        .navbar-user { color: #ffffff; display: flex; align-items: center; gap: 1rem; }
        .navbar-user a { color: #ffffff; text-decoration: none; }
        .navbar-user a:hover { color: #e94560; }
        .wrapper { display: flex; flex: 1; }
        .sidebar { width: 240px; min-height: calc(100vh - 56px); background: #1a1a2e; padding: 1rem 0; flex-shrink: 0; }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; color: #adb5bd; text-decoration: none; padding: 0.75rem 1.5rem; transition: all 0.2s; border-left: 3px solid transparent; }
        .sidebar a:hover, .sidebar a.active { color: #ffffff; background: rgba(233,69,96,0.2); border-left: 3px solid #e94560; }
        .sidebar .nav-section { color: #6c757d; font-size: 0.75rem; text-transform: uppercase; padding: 1rem 1.5rem 0.25rem; letter-spacing: 0.1em; }
        .main-content { flex: 1; padding: 2rem; overflow-y: auto; }
        .page-header { margin-bottom: 1.5rem; border-bottom: 2px solid #e94560; padding-bottom: 0.75rem; }
        .page-header h1 { font-size: 1.75rem; font-weight: 700; color: #1a1a2e; margin: 0; }
        .stat-card { background: #ffffff; border-radius: 8px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid #e94560; }
        .stat-card .stat-value { font-size: 2rem; font-weight: 700; color: #1a1a2e; }
        .stat-card .stat-label { color: #6c757d; font-size: 0.875rem; margin-top: 0.25rem; }
        .stat-card .stat-icon { font-size: 2rem; opacity: 0.3; }
        .card { background: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: none; margin-bottom: 1.5rem; }
        .card-header { background: #f8f9fa; border-bottom: 1px solid #dee2e6; padding: 1rem 1.5rem; font-weight: 600; color: #1a1a2e; border-radius: 8px 8px 0 0 !important; }
        .card-body { padding: 1.5rem; }
        .table { color: #212529; width: 100%; }
        .table th { background: #1a1a2e; color: #ffffff; padding: 0.75rem 1rem; }
        .table td { padding: 0.75rem 1rem; vertical-align: middle; border-bottom: 1px solid #dee2e6; }
        .table tbody tr:hover { background: #f8f9fa; cursor: pointer; }
        .form-control, .form-select { background: #ffffff !important; color: #212529 !important; border: 1px solid #ced4da; padding: 0.5rem 0.75rem; border-radius: 4px; width: 100%; }
        .btn-primary { background: #e94560; border-color: #e94560; color: #ffffff; }
        .btn-primary:hover { background: #c73652; border-color: #c73652; color: #ffffff; }
        .badge-critical { background: #dc3545; color: white; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.75rem; }
        .badge-high { background: #fd7e14; color: white; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.75rem; }
        .badge-medium { background: #ffc107; color: #212529; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.75rem; }
        .badge-low { background: #28a745; color: white; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.75rem; }
        .pagination .page-link { background: #fff; color: #212529; border-color: #dee2e6; }
        .pagination .page-link:hover { background: #e9ecef; color: #212529; }
        .stat-card.blue { border-left-color: #3b82f6; }
        .stat-card.orange { border-left-color: #f97316; }
        .stat-card.red { border-left-color: #e94560; }
        .stat-card.dark-red { border-left-color: #991b1b; }
        .slice-card { background: #ffffff; border-radius: 8px; padding: 1rem 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 1rem; }
        .slice-card .indicator { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 0.5rem; }
        .slice-card .indicator.green { background: #22c55e; }
        .slice-card .indicator.yellow { background: #eab308; }
        .slice-card .indicator.red { background: #e94560; }
    </style>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/dashboard}" href="/dashboard"><i class="bi bi-shield-fill-exclamation"></i> ThreatSense5G</a>
    <div class="navbar-user">
        <span th:if="${currentUsername}"><i class="bi bi-person-circle"></i> <span th:text="${currentUsername}">User</span></span>
        <a th:if="${currentUsername}" th:href="@{/logout}" href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
</nav>
<div class="wrapper">
    <aside class="sidebar">
        <span class="nav-section">Main</span>
        <a th:href="@{/dashboard}" th:classappend="${#strings.startsWith(currentPath,'/dashboard')} ? 'active' : ''"><i class="bi bi-grid"></i> Dashboard</a>
        <span class="nav-section">Traffic</span>
        <a th:href="@{/traffic/upload}" th:classappend="${#strings.startsWith(currentPath,'/traffic/upload')} ? 'active' : ''"><i class="bi bi-upload"></i> Upload Traffic</a>
        <a th:href="@{/traffic/history}" th:classappend="${#strings.startsWith(currentPath,'/traffic/history')} ? 'active' : ''"><i class="bi bi-clock-history"></i> Traffic History</a>
        <span class="nav-section">Security</span>
        <a th:href="@{/threats}" th:classappend="${#strings.startsWith(currentPath,'/threats')} ? 'active' : ''"><i class="bi bi-shield-exclamation"></i> Threats</a>
        <a th:href="@{/alerts}" th:classappend="${#strings.startsWith(currentPath,'/alerts')} ? 'active' : ''"><i class="bi bi-bell"></i> Alerts</a>
        <span class="nav-section">Reports</span>
        <a th:href="@{/reports}" th:classappend="${#strings.startsWith(currentPath,'/reports')} ? 'active' : ''"><i class="bi bi-file-text"></i> Reports</a>
        <div th:if="${isSuperAdmin}">
            <span class="nav-section">Admin</span>
            <a th:href="@{/admin/users}" th:classappend="${#strings.startsWith(currentPath,'/admin/users')} ? 'active' : ''"><i class="bi bi-people"></i> Users</a>
            <a th:href="@{/admin/audit}" th:classappend="${#strings.startsWith(currentPath,'/admin/audit')} ? 'active' : ''"><i class="bi bi-list-ul"></i> Audit Log</a>
        </div>
    </aside>
    <main class="main-content">
        <div layout:fragment="content">Page content here</div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
