<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Audit Log – ThreatSense5G</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h1>Audit Log</h1>
        <p class="text-muted mb-0">View and filter system audit entries.</p>
    </div>

    <div class="card mb-4">
        <div class="card-header">Filters</div>
        <div class="card-body">
            <form class="row g-3 align-items-end" th:action="@{/admin/audit}" method="get">
                <div class="col-md-2">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" th:value="${filterUsername}" placeholder="Filter by user">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Action</label>
                    <select class="form-select" name="action">
                        <option value="">All</option>
                        <option value="LOGIN" th:selected="${filterAction == 'LOGIN'}">LOGIN</option>
                        <option value="LOGOUT" th:selected="${filterAction == 'LOGOUT'}">LOGOUT</option>
                        <option value="USER_CREATED" th:selected="${filterAction == 'USER_CREATED'}">USER_CREATED</option>
                        <option value="USER_TOGGLE_ACTIVE" th:selected="${filterAction == 'USER_TOGGLE_ACTIVE'}">USER_TOGGLE_ACTIVE</option>
                        <option value="ALERT_STATUS_UPDATE" th:selected="${filterAction == 'ALERT_STATUS_UPDATE'}">ALERT_STATUS_UPDATE</option>
                        <option value="ALERT_ASSIGN" th:selected="${filterAction == 'ALERT_ASSIGN'}">ALERT_ASSIGN</option>
                        <option value="ALERT_NOTES_UPDATE" th:selected="${filterAction == 'ALERT_NOTES_UPDATE'}">ALERT_NOTES_UPDATE</option>
                        <option value="ALERT_CREATED_FROM_THREAT" th:selected="${filterAction == 'ALERT_CREATED_FROM_THREAT'}">ALERT_CREATED_FROM_THREAT</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">From</label>
                    <input type="date" class="form-control" name="from" th:value="${filterFrom}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">To</label>
                    <input type="date" class="form-control" name="to" th:value="${filterTo}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Apply</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Entity type</th>
                        <th>Entity ID</th>
                        <th>Detail</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="entry : ${auditPage.content}">
                        <td th:text="${entry.timestamp != null ? #temporals.format(entry.timestamp, 'yyyy-MM-dd HH:mm') : '—'}">—</td>
                        <td th:text="${entry.user != null ? entry.user.username : '—'}">—</td>
                        <td th:text="${entry.action}">—</td>
                        <td th:text="${entry.entityType}">—</td>
                        <td th:text="${entry.entityId}">—</td>
                        <td th:text="${entry.detail}">—</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:if="${auditPage.empty}" class="text-muted py-4">No audit entries found.</div>

    <nav th:if="${auditPage.totalPages > 1}" class="mt-3">
        <ul class="pagination">
            <li class="page-item" th:classappend="${!auditPage.hasPrevious()} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/audit(username=${filterUsername}, action=${filterAction}, from=${filterFrom}, to=${filterTo}, page=${auditPage.number - 1})}">Previous</a>
            </li>
            <li class="page-item disabled"><span class="page-link" th:text="${auditPage.number + 1} + ' / ' + ${auditPage.totalPages}">1 / 1</span></li>
            <li class="page-item" th:classappend="${!auditPage.hasNext()} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/audit(username=${filterUsername}, action=${filterAction}, from=${filterFrom}, to=${filterTo}, page=${auditPage.number + 1})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
