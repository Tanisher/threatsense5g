<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Create User – ThreatSense5G</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div>
            <h1>Create New User</h1>
            <p class="text-muted mb-0">Add a new user account.</p>
        </div>
        <a th:href="@{/admin/users}" class="btn btn-primary">Cancel</a>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card" style="max-width: 28rem;">
        <div class="card-header">User details</div>
        <div class="card-body">
            <form th:action="@{/admin/users/new}" method="post" class="row g-3">
                <div class="col-12">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" required minlength="1" th:value="${username}">
                </div>
                <div class="col-12">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required th:value="${email}">
                </div>
                <div class="col-12">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required minlength="4">
                </div>
                <div class="col-12">
                    <label class="form-label">Role</label>
                    <select class="form-select" name="role" required>
                        <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.name()}">ROLE</option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Create User</button>
                    <a th:href="@{/admin/users}" class="btn btn-secondary ms-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
