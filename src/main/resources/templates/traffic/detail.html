<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Traffic Record – ThreatSense5G</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div>
            <h1>Traffic Record Detail</h1>
            <p class="text-muted mb-0">Detailed view of a single network flow record.</p>
        </div>
        <a th:href="@{/traffic/history}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back to history
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <div class="fw-semibold fs-5">
                        <span th:text="${traffic.srcIp}">10.0.0.1</span>
                        →
                        <span th:text="${traffic.dstIp}">10.0.0.2</span>
                    </div>
                    <div class="text-muted" th:text="${traffic.timestamp}">2024-01-01T00:00:00</div>
                </div>
                <span class="badge" th:classappend="${traffic.processed} ? 'bg-success' : 'bg-warning text-dark'">
                    <span th:text="${traffic.processed} ? 'Processed' : 'Unprocessed'">Processed</span>
                </span>
            </div>

            <dl class="row mb-0">
                <dt class="col-sm-3">Protocol</dt>
                <dd class="col-sm-9" th:text="${traffic.protocol}">TCP</dd>

                <dt class="col-sm-3">Packet size</dt>
                <dd class="col-sm-9" th:text="${traffic.packetSize}">0</dd>

                <dt class="col-sm-3">Packet count</dt>
                <dd class="col-sm-9" th:text="${traffic.packetCount}">0</dd>

                <dt class="col-sm-3">Duration (ms)</dt>
                <dd class="col-sm-9" th:text="${traffic.durationMs}">0</dd>

                <dt class="col-sm-3">Slice type</dt>
                <dd class="col-sm-9" th:text="${traffic.sliceType}">eMBB</dd>

                <dt class="col-sm-3">Upload source</dt>
                <dd class="col-sm-9" th:text="${traffic.uploadSource}">file.csv</dd>
            </dl>
        </div>
    </div>
</div>
</body>
</html>
